# Builds the dataset and publishes it to Cloudflare R2 as it goes.
#
# Runs daily; a run only reaches the eAIPs for new editions (or after
# ALGORITHM_VERSION is bumped), so most days it is a single request. A big
# first run is split across several, each resuming where the last stopped.
#
# Repository settings needed (see README):
#   secrets  R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY
#   vars     R2_ACCOUNT_ID, R2_BUCKET, PUBLIC_BASE_URL, CONTACT
name: pipeline

on:
  schedule:
    - cron: "30 2 * * *"
  workflow_dispatch:
    inputs:
      refresh:
        description: Recheck published editions for changed files
        type: boolean
        default: false
      only:
        description: Limit to these ICAO codes, comma-separated (for testing)
        type: string
        default: ""

concurrency:
  group: pipeline
  cancel-in-progress: false

permissions:
  contents: read
  actions: write # to queue a follow-on run

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt

      - run: pip install -r requirements-dev.txt

      - name: Tests
        run: python -m pytest -q tests

      - name: Build and publish
        # Each file is uploaded to R2 as soon as it's written, so a stopped
        # run loses nothing. A run stops cleanly at its time budget and the
        # next step queues a follow-on run that resumes.
        env:
          R2_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: >
          python -m imgmap_backend.pipeline
          --out out
          --publish-r2
          --max-minutes 300
          --previous "${{ vars.PUBLIC_BASE_URL }}"
          --contact "${{ vars.CONTACT }}"
          ${{ inputs.refresh && '--refresh' || '' }}
          ${{ inputs.only && format('--only {0}', inputs.only) || '' }}

      - name: Continue if unfinished
        if: hashFiles('out/.incomplete') != '' && !inputs.only
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pipeline --ref "${{ github.ref_name }}"
