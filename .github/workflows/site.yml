# Publishes the website in site/ (the flight replay page) to the same R2
# bucket as the data, whenever it changes on main.
#
# Uses the pipeline's repository settings (see README).
name: site

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "imgmap_backend/site.py"
      - "tests/site/**"
      - ".github/workflows/site.yml"
  workflow_dispatch:

concurrency:
  group: site
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt

      - run: pip install -r requirements.txt

      - name: Tests
        run: node --test tests/site/*.test.mjs

      - name: Publish
        env:
          R2_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: python -m imgmap_backend.site publish
